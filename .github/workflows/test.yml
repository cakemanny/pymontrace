name: Test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "master" ]

env:
  PYTHON_VERSIONS: "3.9 3.10 3.11 3.12 3.13"

jobs:

  check:
    runs-on: ubuntu-latest
    container:
      image: python:3.9
    steps:
    - uses: actions/checkout@v4
    # Acquire python header files
    - run: make check

  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [
          # "macos-13",
          "macos-latest",
          "ubuntu-latest",
          # "ubuntu-24.04-arm"
        ]

    runs-on: ${{ matrix.runner }}

    # Pymontrace does not work on macOS with a Python installed
    # in /Library/Frameworks/Python.framework, and especially not the
    # the codesigned universal binaries from python.org. So we use homebrew
    # on macOS instead.
    steps:
    - name: Disable man-db triggers
      if: ${{ startsWith(matrix.runner, 'ubuntu-') }}
      # https://github.com/actions/runner-images/issues/10977#issuecomment-2810713336
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      if: ${{ ! startsWith(matrix.runner, 'macos-') }}
      with:
        python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
    - name: Install Python
      if: ${{ startsWith(matrix.runner, 'macos-') }}
      # The github hosted runners seem to come with certain system python
      # version installed and linked into the brew cellar, so we must use
      # brew reinstall.
      run: |
        # shellcheck disable=SC2086,SC2046
        brew uninstall -f --ignore-dependencies $(for V in $PYTHON_VERSIONS; do
          # shellcheck disable=SC2046
          printf "%s " python@${V};
        done)
        # shellcheck disable=SC2086,SC2046
        brew install --overwrite $(for V in $PYTHON_VERSIONS; do
          printf "%s " python@${V};
        done)
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
    - name: Print Versions
      run: |
        uname -a
        # shellcheck disable=SC2086
        for V in $PYTHON_VERSIONS; do
          python${V} -VV
          file "$( which python${V} )"
        done
        uv --version
    - name: Create virtualenv
      env:
        UV_PYTHON_DOWNLOADS: never
      run: |
        # shellcheck disable=SC2086
        for V in $PYTHON_VERSIONS; do
          uv venv -p ${V} .venv${V}
        done

    - name: Install dependencies
      env:
        PYMONTRACE_DEBUG: ${{ runner.debug && '1' || '' }}
      run: |
        # shellcheck disable=SC2086,SC1090
        for V in $PYTHON_VERSIONS; do
          source .venv${V}/bin/activate
          uv pip install '.[test]' pyright
        done
    - name: Lint with flake8
      run: |
        # shellcheck disable=SC2086,SC1090
        for V in $PYTHON_VERSIONS; do
          source .venv${V}/bin/activate
          flake8 src --count --show-source --statistics
        done
    - name: Typecheck with Pyright
      run: |
        # shellcheck disable=SC2086,SC1090
        for V in $PYTHON_VERSIONS; do
          {
            source .venv${V}/bin/activate
            pyright src
          } &
        done
        for V in $PYTHON_VERSIONS; do
          wait -n
        done
    - name: Test with pytest
      timeout-minutes: 1
      env:
        PYTEST_ADDOPTS: ${{ runner.debug && '-vv -s' || '' }}
      run: |
        # shellcheck disable=SC2086,SC1090
        for V in $PYTHON_VERSIONS; do
          source .venv${V}/bin/activate
          ulimit -c unlimited
          if [[ $(uname) == "Darwin" ]]; then
            sudo pytest -v --color=yes
          else
            pytest -v --color=yes
          fi
        done
    - name: Run Integration tests
      run: |
        # shellcheck disable=SC2086,SC1090
        for V in $PYTHON_VERSIONS; do
          source .venv${V}/bin/activate
          ulimit -c unlimited
          if [[ $(uname) == "Darwin" ]]; then
            sudo pytest integration_tests
          else
            echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
            pytest integration_tests
          fi
        done

    - if: ${{ env.ACT == 'true' }}
      name: Install gdb and systemd-coredump
      run: |
        sudo apt-get update
        sudo apt-get install -y systemd-coredump

    - name: Check for core files
      if: always()
      run: |
        # macOS
        if [ -d /cores/ ]; then
          find /cores -type f -print0 | xargs -0 -r lldb --batch -o 'backtrace' -c
        fi
        # Linux
        test -d /proc && cat /proc/sys/kernel/core_pattern
        if [ -d /var/lib/systemd/coredump/ ]; then
          find /var/lib/systemd/coredump/ -type f
          if coredumpctl list; then
            coredumpctl -1 info
            [ "$RUNNER_DEBUG" = 1 ] && coredumpctl -1 dump --output=core
          fi
        fi
        if [ -f core ]; then
          if [ "$RUNNER_DEBUG" = 1 ]; then
            echo "::group::Install gdb"
            sudo apt-get update && sudo apt-get install -y gdb
            echo "::endgroup::"
            # Not sure how we will know which one dumped core...
            for V in 3.9; do
              gdb --batch -ex 'backtrace' "$( which python${V} )" core
            done
          else
            echo "$(tput setaf 6)Rerun the workflow with debugging enabled" \
                 "to dump the stacktrace with gdb $(tput sgr0)"
          fi
        fi
